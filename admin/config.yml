backend:
  name: git-gateway
  branch: main

# 관리자 화면에서 올린 이미지가 저장되는 곳
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "ko"
publish_mode: simple

collections:
  # ----------------------------------------------------------
  # 블로그 글
  # ----------------------------------------------------------
  - name: "posts"
    label: "학습 이야기"
    label_singular: "글"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "제목", widget: "string" }
      - { name: "date", label: "발행일", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: "excerpt", label: "요약", widget: "text", hint: "목록과 검색결과에 나옵니다. 80자 안팎이 좋습니다." }
      - { name: "tags", label: "태그", widget: "list", required: false, default: [] }
      - { name: "cover", label: "대표 이미지", widget: "image", required: false }
      - { name: "body", label: "본문", widget: "markdown" }

  # ----------------------------------------------------------
  # 수강 후기
  # ----------------------------------------------------------
  - name: "reviews"
    label: "수강 후기"
    files:
      - name: "reviews"
        label: "후기 목록"
        file: "data/reviews.json"
        fields:
          - name: "reviews"
            label: "후기"
            label_singular: "후기"
            widget: "list"
            summary: "{{fields.quote}}"
            fields:
              - { name: "quote", label: "한 줄 제목", widget: "string", hint: "예: 수학 28점에서 80점으로" }
              - { name: "subject", label: "과목", widget: "string" }
              - { name: "byline", label: "작성자 표기", widget: "string", hint: "예: 수강생 후기 / 담당 코치 기록" }
              - { name: "proof", label: "성적표 이미지", widget: "image" }
              - { name: "proofAlt", label: "이미지 설명", widget: "string", hint: "눈이 불편한 분과 검색엔진이 읽습니다." }
              - { name: "body", label: "내용", widget: "text", hint: "문단은 빈 줄로 나눕니다." }

  # ----------------------------------------------------------
  # 전국지점
  # ----------------------------------------------------------
  - name: "centers"
    label: "전국지점"
    files:
      - name: "centers"
        label: "지점 목록"
        file: "data/centers.json"
        fields:
          - name: "centers"
            label: "지점"
            label_singular: "지점"
            widget: "list"
            summary: "{{fields.name}} — {{fields.address}}"
            fields:
              - { name: "name", label: "지점명", widget: "string" }
              - name: "region"
                label: "권역"
                widget: "select"
                options: ["서울/인천", "경기", "대전/충청", "강원/제주", "경상/전라"]
              - { name: "city", label: "시·군·구", widget: "string", hint: "예: 강동구, 성남시 분당구" }
              - { name: "address", label: "주소", widget: "string", hint: "시·도로 시작하는 도로명주소. 예: 서울 강동구 양재대로 1606 3층" }
              - { name: "landmark", label: "찾는 법", widget: "string", required: false }
              - { name: "subjects", label: "과목", widget: "list", required: false }
              - { name: "schools", label: "인근 학교", widget: "text", required: false }
              - { name: "reg", label: "교육지원청 등록번호", widget: "string", required: false }

  # ----------------------------------------------------------
  # 사이트 기본 정보
  # ----------------------------------------------------------
  - name: "settings"
    label: "사이트 설정"
    files:
      - name: "site"
        label: "기본 정보"
        file: "data/site.json"
        fields:
          - { name: "name", label: "센터 이름", widget: "string" }
          - { name: "tagline", label: "한 줄 소개", widget: "string" }
          - { name: "tel", label: "전화번호", widget: "string", hint: "하이픈 포함. 예: 010-3206-1175" }
          - { name: "hours", label: "영업시간 (짧게)", widget: "string" }
          - { name: "hoursFull", label: "영업시간 (전체)", widget: "string" }
          - { name: "address", label: "센터 주소", widget: "string" }
          - { name: "myCenter", label: "우리 지점명", widget: "string", required: false, hint: "전국지점 목록에서 맨 위에 강조됩니다. 지점 목록의 이름과 똑같이 적으세요." }
          - { name: "siteUrl", label: "사이트 주소", widget: "string", hint: "끝에 / 없이. sitemap에 쓰입니다." }
          - { name: "naverVerification", label: "네이버 소유확인 코드", widget: "string", required: false }
          - { name: "kakaoMapKey", label: "카카오맵 키", widget: "string", required: false, hint: "비우면 구글 지도로 표시됩니다." }
          - { name: "formAction", label: "상담 폼 전송 주소", widget: "string", required: false, hint: "Formspree 등에서 받은 주소" }
          - { name: "bizInfo", label: "사업자 정보", widget: "string" }
          - name: "links"
            label: "SNS 링크"
            widget: "object"
            fields:
              - { name: "blog", label: "네이버 블로그", widget: "string", required: false }
              - { name: "instagram", label: "인스타그램", widget: "string", required: false }
              - { name: "kakao", label: "카카오톡 채널", widget: "string", required: false }
